name: SearchRepo 릴리스 초안

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: 테스트 및 디버그 빌드
    uses: ./.github/workflows/android-ci.yml

  draft-release:
    name: GitHub Release 초안 만들기
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 검증된 APK 아티팩트 내려받기
        uses: actions/download-artifact@v8
        with:
          name: searchrepo-dev-debug-apk
          path: release-files

      - name: APK를 첨부해 Release 초안 저장
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=release-files/app-dev-debug.apk
          test -s "$apk"

          existing_tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if grep -Fxq -- "$GITHUB_REF_NAME" <<< "$existing_tags"; then
            echo "::error::이 태그의 Release 또는 초안이 이미 있습니다."
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" "$apk" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "SearchRepo $GITHUB_REF_NAME" \
            --notes "검색·Paging 테스트와 Android devDebug 빌드를 통과한 실습용 APK입니다."
